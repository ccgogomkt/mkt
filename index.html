<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCgogoMKT</title>
    <style>
        :root {
            --bg-color: #0f141c;
            --container-bg: #161f2b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-primary: #dcd0ff;  /* 仅修改此处：变为淡紫色 */
            --accent-secondary: #b3a5ef;/* 仅修改此处：变为薰衣草紫 */
            --border-color: #243242;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title {
            font-size: 1.25rem;
            color: var(--accent-primary);
            margin: 35px 0 15px 0;
            padding-left: 10px;
            border-left: 3px solid var(--accent-secondary);
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .grid {
            display: block;
        }

        .card {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 12px;
            transition: all 0.25s ease;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-primary);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .card-icon {
            color: var(--accent-secondary);
            font-size: 1.1rem;
            opacity: 0.8;
        }

        footer {
            margin-top: 50px;
            padding-top: 25px;
            border-top: 1px solid var(--border-color);
        }

        .contact-box {
            background: linear-gradient(135deg, #161f2b 0%, #1c2635 100%);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .contact-title {
            font-size: 1.15rem;
            color: var(--text-main);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .contact-info {
            display: block;
            margin: 8px 0;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .contact-info strong {
            color: var(--accent-primary);
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 15px;
            }
            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>CCgogoMKT</h1>
        </header>

        <div class="section-title">MKT训练营</div>
        <div class="grid">
            <a href="品牌营销全案思维框架训练营.pdf" target="_blank" class="card">
                <div class="card-title">品牌营销全案思维框架训练营</div>
                <div class="card-icon">📄</div>
            </a>
            <a href="Meta Ads实战训练营.pdf" target="_blank" class="card">
                <div class="card-title">Meta Ads实战训练营</div>
                <div class="card-icon">📄</div>
            </a>
        </div>

        <div class="section-title">出海营销</div>
        <div class="grid">
            <a href="出海营销陪跑群.pdf" target="_blank" class="card">
                <div class="card-title">出海营销陪跑群</div>
                <div class="card-icon">📄</div>
            </a>
            <a href="出海营销增长咨询.pdf" target="_blank" class="card">
                <div class="card-title">出海营销增长咨询</div>
                <div class="card-icon">📄</div>
            </a>
        </div>

        <div class="section-title">MKT求职</div>
        <div class="grid">
            <a href="MKT1v1求职服务.png" target="_blank" class="card">
                <div class="card-title">MKT 1v1 求职服务</div>
                <div class="card-icon">🖼️</div>
            </a>
        </div>

        <footer>
            <div class="contact-box">
                <div class="contact-title">Contact Me</div>
                <div class="contact-info"><strong>WeChat:</strong> xieqiao172132</div>
                <div class="contact-info"><strong>Email:</strong> ccgogo2024@gmail.com</div>
            </div>
        </footer>
    </div>

</body>
</html>
