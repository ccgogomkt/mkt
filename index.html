<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCgogoMKT</title>
    <style>
        :root {
            /* 强制覆盖：全新优雅纯正浅紫配色方案 */
            --bg-color: #0b0c10 !important;          
            --container-bg: #141722 !important;      
            --text-main: #f3f4f6 !important;          
            --text-muted: #a3a8b4 !important;         
            --accent-purple-light: #dcd0ff !important; /* 纯正亮淡紫 */
            --accent-purple-deep: #b3a5ef !important;  /* 柔和薰衣草紫 */
            --border-purple: #232736 !important;       
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color) !important;
            color: var(--text-main) !important;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-purple);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, var(--accent-purple-light), var(--accent-purple-deep)) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
        }

        /* 大板块标题强制变为淡紫色 */
        .section-title {
            font-size: 1.25rem;
            color: var(--accent-purple-light) !important;
            margin: 35px 0 15px 0;
            padding-left: 10px;
            border-left: 3px solid var(--accent-purple-deep) !important;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .grid {
            display: block;
        }

        .card {
            background-color: var(--container-bg) !important;
            border: 1px solid var(--border-purple) !important;
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 12px;
            transition: all 0.25s ease;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-purple-light) !important;
            box-shadow: 0 8px 24px rgba(179, 165, 239, 0.25) !important; 
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-main) !important;
        }

        .card-icon {
            color: var(--accent-purple-deep) !important;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        footer {
            margin-top: 50px;
            padding-top: 25px;
            border-top: 1px solid var(--border-purple);
        }

        .contact-box {
            background: linear-gradient(135deg, #141722 0%, #1c202e 100%) !important;
            border: 1px solid var(--border-purple) !important;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .contact-title {
            font-size: 1.15rem;
            color: var(--text-main) !important;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .contact-info {
            display: block;
            margin: 8px 0;
            font-size: 1rem;
            color: var(--text-muted) !important;
        }

        .contact-info strong {
            color: var(--accent-purple-light) !important;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 15px;
            }
            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
