<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCgogoMKT</title>
    <style>
        :root {
            --bg-color: #0f1219;          /* 深邃暗底色 */
            --container-bg: #161a23;      /* 容器卡片背景 */
            --text-main: #f3f4f6;          /* 主文字颜色 */
            --text-muted: #9ca3af;         /* 次要文字颜色 */
            --accent-primary: #c3b5e3;    /* 核心淡紫（原橘黄/暗金位置） */
            --accent-secondary: #a78bfa;  /* 亮淡紫/丁香紫（原珊瑚红位置） */
            --border-color: #222938;       /* 边框暗色 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title {
            font-size: 1.25rem;
            color: var(--accent-primary);
            margin: 35px 0 15px 0;
            padding-left: 10px;
            border-left: 3px solid var(--accent-secondary);
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .grid {
            display: block;
        }

        .card {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 12px;
            transition: all 0.25s ease;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-primary);
            box-shadow: 0 8px 24px rgba(167, 139, 250, 0.15); /* 淡淡的紫色霓虹倒影 */
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .card-icon {
            color: var(--accent-secondary);
            font-size: 1.1rem;
            opacity: 0.9;
        }
